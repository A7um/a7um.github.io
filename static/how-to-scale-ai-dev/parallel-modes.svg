<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Monaco, Menlo, 'Ubuntu Mono', monospace" font-size="13">
  <style>
    .bg { fill: #1e1e1e; }
    .axis-line { stroke: #5f8700; stroke-width: 2; fill: none; }
    .tick { stroke: #5f8700; stroke-width: 1.5; }
    .card { fill: #2d2d30; stroke: #5f8700; stroke-width: 1.3; }
    .card-exp { fill: #2a2320; stroke: #d16969; stroke-width: 1.3; stroke-dasharray: 5 3; }
    .title { fill: #d4d4d4; font-size: 15px; font-weight: bold; letter-spacing: 0.05em; }
    .axis-label { fill: #d4d4d4; font-size: 11px; }
    .mode-name { fill: #dcdcaa; font-size: 13px; font-weight: bold; }
    .mode-desc { fill: #d4d4d4; font-size: 12px; }
    .cm { fill: #6a9955; font-size: 11px; }
    .dim { fill: #808080; font-size: 11px; }
    .kw { fill: #569cd6; font-size: 12px; }
    .exp-badge-bg { fill: #3a2020; stroke: #d16969; stroke-width: 1; }
    .exp-badge { fill: #d16969; font-size: 10px; font-weight: bold; }
  </style>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5f8700"/>
    </marker>
  </defs>

  <rect class="bg" width="880" height="320"/>

  <text x="20" y="30" class="title">Parallel modes, by granularity</text>

  <!-- axis: left label, solid line, right label, arrow -->
  <text x="20" y="78" class="axis-label">coarse</text>
  <line x1="70" y1="74" x2="800" y2="74" class="axis-line"/>
  <polygon points="800,74 788,68 788,80" fill="#5f8700"/>
  <text x="812" y="78" class="axis-label">fine</text>

  <!-- ticks to mark each mode center -->
  <line x1="170" y1="68" x2="170" y2="80" class="tick"/>
  <line x1="390" y1="68" x2="390" y2="80" class="tick"/>
  <line x1="590" y1="68" x2="590" y2="80" class="tick"/>
  <line x1="790" y1="68" x2="790" y2="80" class="tick"/>

  <!-- secondary axis note -->
  <text x="440" y="50" text-anchor="middle" class="dim">your attention cost: high (left) &#8594; low (right)</text>

  <!-- mode 1 -->
  <g>
    <rect x="80" y="110" width="180" height="140" class="card" rx="4"/>
    <text x="170" y="134" text-anchor="middle" class="kw">mode 1</text>
    <text x="170" y="156" text-anchor="middle" class="mode-name">cross-project</text>
    <text x="170" y="184" text-anchor="middle" class="mode-desc">multiple repos,</text>
    <text x="170" y="202" text-anchor="middle" class="mode-desc">one agent each</text>
    <text x="170" y="232" text-anchor="middle" class="cm">// zero coordination</text>
  </g>

  <!-- mode 2 -->
  <g>
    <rect x="300" y="110" width="180" height="140" class="card" rx="4"/>
    <text x="390" y="134" text-anchor="middle" class="kw">mode 2</text>
    <text x="390" y="156" text-anchor="middle" class="mode-name">same-repo branches</text>
    <text x="390" y="184" text-anchor="middle" class="mode-desc">different directions,</text>
    <text x="390" y="202" text-anchor="middle" class="mode-desc">git worktree isolates</text>
    <text x="390" y="232" text-anchor="middle" class="cm">// or try N approaches</text>
  </g>

  <!-- mode 3 -->
  <g>
    <rect x="500" y="110" width="180" height="140" class="card" rx="4"/>
    <text x="590" y="134" text-anchor="middle" class="kw">mode 3</text>
    <text x="590" y="156" text-anchor="middle" class="mode-name">cross-concern</text>
    <text x="590" y="184" text-anchor="middle" class="mode-desc">same feature, split by</text>
    <text x="590" y="202" text-anchor="middle" class="mode-desc">backend / UI / bugfix</text>
    <text x="590" y="232" text-anchor="middle" class="cm">// finest you-driven</text>
  </g>

  <!-- mode 4 -->
  <g>
    <rect x="700" y="110" width="180" height="140" class="card-exp" rx="4"/>
    <text x="790" y="134" text-anchor="middle" class="kw">mode 4</text>
    <text x="790" y="156" text-anchor="middle" class="mode-name">agent self-scheduled</text>
    <text x="790" y="184" text-anchor="middle" class="mode-desc">agent splits the task</text>
    <text x="790" y="202" text-anchor="middle" class="mode-desc">into sub-agents itself</text>
    <text x="790" y="232" text-anchor="middle" class="cm">// you just toss the task</text>

    <rect x="748" y="100" width="84" height="18" rx="3" class="exp-badge-bg"/>
    <text x="790" y="113" text-anchor="middle" class="exp-badge">EXPERIMENTAL</text>
  </g>

  <!-- footer -->
  <text x="440" y="295" text-anchor="middle" class="cm">// modes stack: e.g. mode 2 + mode 3 nested inside one worktree</text>
</svg>
